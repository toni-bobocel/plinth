name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # PGlite covers behaviour; this proves the migrations and the role setup
  # hold on the Postgres version we actually run.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: plinth
          POSTGRES_PASSWORD: plinth
          POSTGRES_DB: plinth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U plinth"
          --health-interval 2s
          --health-retries 15
    env:
      PGPASSWORD: plinth
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @plinth/db...
      - run: psql -h localhost -U plinth -d plinth -f infra/postgres-init.sql
      - run: pnpm --filter @plinth/db build
      - run: pnpm --filter @plinth/db migrate
        env:
          MIGRATION_DATABASE_URL: postgres://plinth:plinth@localhost:5432/plinth
      - name: plinth_app sees nothing without a tenant
        run: |
          count=$(psql -h localhost -U plinth -d plinth -tAc "set role plinth_app; select count(*) from projects")
          test "$count" = "0"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: plinth-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
