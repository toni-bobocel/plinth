version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      tooling:
        patterns: ["@biomejs/*", "turbo", "typescript", "vitest"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: monthly }
